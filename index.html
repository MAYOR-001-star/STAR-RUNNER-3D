<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Star Runner 3D — a start.ng game</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="scene"></canvas>
<div id="loading">LOADING STAR RUNNER...</div>
<div class="hud" id="player-card">
  <img id="player-face" alt="player">
  <div class="who"><b id="player-name">Guest</b><span id="player-account">Not signed in</span></div>
  <button id="player-signin" hidden>Sign in</button>
</div>
<div class="hud" id="stats">
  <div class="pill"><small>DIST</small><span id="ui-dist">0</span>m</div>
  <div class="pill"><small>STARS</small><span id="ui-stars">0</span></div>
  <button class="pill" id="btn-pause" title="Pause (P)" hidden>II</button>
</div>
<div class="hud" id="toast"></div>
<div id="bigbtns"><div><button id="btn-left">L</button> <button id="btn-right">R</button></div><div><button id="btn-down">D</button> <button id="btn-up">U</button></div></div>
<div id="overlay"><div class="card" id="menu">
  <h1><span class="star">STAR</span> RUNNER 3D</h1>
  <p>Dodge barriers, grab stars. Your <b>start.ng character</b> is the runner — its body, colours, hair, hat and accessory appear in 3D.</p>
  <div class="keys"><span>Left/Right move</span><span>Up/Space jump</span><span>Down slide</span><span>P pause</span></div>
  <button class="btn" id="btn-play">Play</button>
  <button class="btn ghost" id="btn-sign">Sign in with start.ng</button>
  <p id="best-line" style="opacity:.75"></p>
  <ol id="board"></ol>
</div><div class="card" id="pause-menu" hidden>
  <h1>Paused</h1>
  <p id="pause-dist">Distance: <span id="pause-dist-val">0</span>m</p>
  <p id="pause-stars">Stars: <span id="pause-stars-val">0</span></p>
  <button class="btn" id="btn-resume">Resume</button>
  <button class="btn ghost" id="btn-quit">Quit to menu</button>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script src="./startng.js"></script>
<script src="./avatar.js"></script>
<script src="./avatar2.js"></script>
<script src="./game.js"></script>
</body>
</html>
